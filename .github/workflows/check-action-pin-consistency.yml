name: Check Action Pin Consistency

on:
  pull_request:
    paths:
      - .github/action-pins.txt
      - .github/workflows/actions-inventory.yml
      - .github/workflows/reusable-build-and-push.yml
      - .github/workflows/zizmor.yml
      - scripts/check-action-pin-consistency.sh
  push:
    branches:
      - main
    paths:
      - .github/action-pins.txt
      - .github/workflows/actions-inventory.yml
      - .github/workflows/reusable-build-and-push.yml
      - .github/workflows/zizmor.yml
      - scripts/check-action-pin-consistency.sh

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash scripts/check-action-pin-consistency.sh
